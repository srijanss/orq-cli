[package]
name = "orq-remote"
version.workspace = true
edition.workspace = true

[dependencies]
orq-core = { path = "../orq-core" }
orq-git = { path = "../orq-git" }
orq-features = { path = "../orq-features" }
orq-orchestrator = { path = "../orq-orchestrator" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

serde_json = "1"
libc = "0.2"

[dev-dependencies]
sha2 = "0.10"
