[package]
name = "orq-remote"
version.workspace = true
edition.workspace = true

[dependencies]
orq-core = { path = "../orq-core" }
orq-agents = { path = "../orq-agents" }
orq-git = { path = "../orq-git" }
orq-features = { path = "../orq-features" }
orq-orchestrator = { path = "../orq-orchestrator" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }

serde_json = "1"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
orq-test-support = { path = "../orq-test-support" }
p256 = { version = "0.13", features = ["ecdsa"] }
