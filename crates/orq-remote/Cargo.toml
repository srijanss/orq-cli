[package]
name = "orq-remote"
version.workspace = true
edition.workspace = true

[dependencies]
orq-core = { path = "../orq-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
